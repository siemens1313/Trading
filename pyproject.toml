[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bottom-bots"
version = "0.1.0"
description = "Six bots that score the five-signal capitulation-bottom checklist: VIX, put/call, dealer gamma, short interest, flows and sentiment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bottom-bots = "bottom_bots.cli:main"

[tool.setuptools.packages.find]
include = ["bottom_bots*"]

[tool.setuptools.package-data]
bottom_bots = ["thresholds.toml"]
